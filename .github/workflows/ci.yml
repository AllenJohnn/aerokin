name: CI

on:
  push:
    branches: ['main', 'feat/*']
  pull_request:
    branches: ['main']

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce S1-S5 Safety Invariants
        run: pnpm run safety:check

      - name: Typecheck Design System
        run: pnpm --filter @aerokin/design-system exec tsc --noEmit

      - name: Typecheck Server
        run: pnpm --filter aerokin-server exec tsc --noEmit

      - name: Typecheck PWA
        run: pnpm --filter aerokin-pwa exec tsc --noEmit

      - name: Run Signaling Tests
        run: pnpm --filter aerokin-signaling test

      - name: Run Server Tests
        run: pnpm --filter aerokin-server test

      - name: Run PWA Tests
        run: pnpm --filter aerokin-pwa test

      - name: Build Design System
        run: pnpm --filter @aerokin/design-system build

      - name: Build PWA Client
        run: pnpm --filter aerokin-pwa build

      - name: Build Server
        run: pnpm --filter aerokin-server run build
