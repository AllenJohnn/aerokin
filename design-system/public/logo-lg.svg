<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="96" height="96" fill="none">
  <defs>
    <filter id="glow-filter-lg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="a-grad-lg" x1="16" y1="84" x2="84" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="trail-grad-lg" x1="26" y1="60" x2="82" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#7C5CFF" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="dot-radial-lg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#22D3EE" />
      <stop offset="70%" stop-color="#7C5CFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient background glow behind the A -->
  <path d="M 22 84 L 47 18 C 48.2 15 51.8 15 53 18 L 78 84" stroke="url(#a-grad-lg)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.15" filter="url(#glow-filter-lg)" />

  <!-- Angular A Legs -->
  <path d="M 22 84 L 47 18 C 48.2 15 51.8 15 53 18 L 78 84" stroke="url(#a-grad-lg)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Trail crossbar with neon emission -->
  <path d="M 26 60 Q 52 56 82 52" stroke="url(#trail-grad-lg)" stroke-width="5" stroke-linecap="round" opacity="0.7" filter="url(#glow-filter-lg)" />
  <path d="M 26 60 Q 52 56 82 52" stroke="url(#trail-grad-lg)" stroke-width="3.2" stroke-linecap="round" />

  <!-- Glowing Cursor Dot with corona and core -->
  <circle cx="82" cy="52" r="14" fill="url(#dot-radial-lg)" opacity="0.85" filter="url(#glow-filter-lg)" />
  <circle cx="82" cy="52" r="4" fill="#FFFFFF" />
  <circle cx="82" cy="52" r="2.2" fill="#22D3EE" />
</svg>
