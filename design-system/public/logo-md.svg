<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48" fill="none">
  <defs>
    <filter id="glow-filter-md" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="a-grad-md" x1="16" y1="84" x2="84" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="trail-grad-md" x1="28" y1="60" x2="80" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#7C5CFF" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="dot-radial-md" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Angular A Legs -->
  <path d="M 22 84 L 47 18 C 48.2 15 51.8 15 53 18 L 78 84" stroke="url(#a-grad-md)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Trail crossbar with glow -->
  <path d="M 28 60 Q 52 56 80 53" stroke="url(#trail-grad-md)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow-filter-md)" opacity="0.6" />
  <path d="M 28 60 Q 52 56 80 53" stroke="url(#trail-grad-md)" stroke-width="3" stroke-linecap="round" />
  <!-- Glowing Cursor Dot -->
  <circle cx="80" cy="53" r="10" fill="url(#dot-radial-md)" opacity="0.9" />
  <circle cx="80" cy="53" r="3.8" fill="#FFFFFF" />
  <circle cx="80" cy="53" r="2.2" fill="#22D3EE" />
</svg>
