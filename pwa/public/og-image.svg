<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Plain Black Background -->
  <rect width="1200" height="630" fill="#000000" />

  <!-- Centered Content -->
  <g transform="translate(600, 260)">
    <!-- Logo Mark centered (120x120 scaled) -->
    <g transform="translate(-60, -100) scale(1.2)">
      <polygon points="50,14 18,84 34,84 46,56 50,45" fill="#F5F5F5" />
      <polygon points="50,14 54,45 59,56 82,84 66,84" fill="#F5F5F5" />
      <polygon points="8,53 22,53 26,44 12,44" fill="#F5F5F5" opacity="0.6" />
      <polygon points="26,53 76,53 90,44 74,44 77,48 32,48" fill="#F5F5F5" />
      <circle cx="90" cy="44" r="3.5" fill="#FF5A1F" />
    </g>

    <!-- Wordmark "Aerokin" -->
    <text text-anchor="middle" y="90" 
          font-family="'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="60" 
          font-weight="600" 
          letter-spacing="-0.03em" 
          fill="#F5F5F5">Aerokin</text>

    <!-- Subtitle -->
    <text text-anchor="middle" y="145" 
          font-family="'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="24" 
          font-weight="400" 
          letter-spacing="-0.01em" 
          fill="#8A8A8A">Control your PC from your iPhone.</text>
  </g>
</svg>
