services:
  # 1. AEROKIN Standalone Signaling Service
  signaling:
    build:
      context: ..
      dockerfile: signaling/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - TURN_SECRET=${TURN_SECRET:?TURN_SECRET must be set in environment}
      - COTURN_HOST=${COTURN_HOST:-turn.aerokin.local}
      - COTURN_UDP_PORT=3478
      - COTURN_TCP_PORT=3478
      - COTURN_TLS_PORT=5349
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - aerokin-net

  # 2. Self-Hosted Coturn STUN/TURN Server
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    command:
      - turnserver
      - -a
      - -v
      - -c=/etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set in environment}
      - --realm=${TURN_REALM:-aerokin.local}
      - --external-ip=${EXTERNAL_IP:-127.0.0.1}
      - --min-port=49152
      - --max-port=65535
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    network_mode: host

  # 3. Caddy Reverse Proxy (Automatic HTTPS TLS via Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - AEROKIN_SIGNALING_DOMAIN=${AEROKIN_SIGNALING_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aerokin-net

networks:
  aerokin-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
