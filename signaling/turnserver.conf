# ==============================================================================
# AEROKIN Self-Hosted Coturn STUN/TURN Configuration
# ==============================================================================

# Standard STUN/TURN listening ports
listening-port=3478
tls-listening-port=5349

# Ephemeral relay port range (keep bounded for VPS firewall convenience)
min-port=49152
max-port=49300

# Require standard WebRTC message integrity fingerprints
fingerprint

# Use long-term credential mechanism and REST API shared-secret auth
lt-cred-mech
use-auth-secret

# Shared secret and realm (overridden by command line / environment in docker-compose)
static-auth-secret=aerokin-default-coturn-shared-secret-change-in-prod
realm=aerokin.local

# Security hardening: Prevent loopback and multicast peer connections
no-loopback-peers
no-multicast-peers
no-cli

# Logging
verbose
log-file=stdout
